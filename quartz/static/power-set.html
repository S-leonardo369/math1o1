<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px;
    padding: 1.25rem;
    background: transparent;
    color: #2A201C;
  }

  @media (prefers-color-scheme: dark) {
    body { color: #EDE8E2; }
    input { background: #252019; color: #EDE8E2; border-color: #352E28; }
    .card { background: #252019; border-color: #352E28; }
    .stat { background: #252019; }
    .formula { background: #252019; border-left-color: #4BBFC4; }
    .subset-item { background: #1B1714; border-color: #352E28; }
    .subset-item.special { border-color: #4BBFC4; color: #4BBFC4; }
    .warn { background: #2A1E10; border-left-color: #E09050; color: #E09050; }
    .index { color: #6E6460; }
    button { background: #4BBFC4; }
    button:hover { background: #2A8F93; }
  }

  label {
    display: block;
    font-size: 12px;
    color: #9A8C85;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  .row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 4px;
  }

  input {
    flex: 1;
    height: 38px;
    border: 1px solid #E3D9D1;
    border-radius: 8px;
    padding: 0 12px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    font-size: 14px;
    outline: none;
    background: #FAF8F5;
    color: #2A201C;
    transition: border-color 160ms;
  }

  input:focus { border-color: #0C7075; }

  button {
    height: 38px;
    padding: 0 18px;
    background: #0C7075;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    transition: background 160ms;
    white-space: nowrap;
  }

  button:hover { background: #0A5D61; }

  .err {
    font-size: 12px;
    color: #B5600D;
    min-height: 18px;
    margin-top: 4px;
  }

  .stats {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 1rem 0;
  }

  .stat {
    background: #F2EDE7;
    border-radius: 8px;
    padding: .75rem;
    text-align: center;
  }

  .stat-label {
    font-size: 11px;
    color: #9A8C85;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 4px;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 500;
    color: #0C7075;
  }

  .stat-value.mono {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
  }

  .formula {
    display: none;
    background: #F2EDE7;
    border-left: 3px solid #0C7075;
    border-radius: 0 8px 8px 0;
    padding: .6rem 1rem;
    font-size: 13px;
    color: #6B5E57;
    margin-bottom: 1rem;
  }

  .subset-label {
    font-size: 12px;
    color: #9A8C85;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-bottom: 8px;
    display: none;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 6px;
  }

  .subset-item {
    background: #FAF8F5;
    border: 1px solid #E3D9D1;
    border-radius: 8px;
    padding: 7px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 7px;
  }

  .subset-item.special {
    border-color: #0C7075;
    color: #0C7075;
    font-weight: 500;
  }

  .index {
    font-size: 11px;
    color: #9A8C85;
    min-width: 16px;
    flex-shrink: 0;
  }

  .warn {
    display: none;
    background: #FDF0E4;
    border-left: 3px solid #B5600D;
    border-radius: 0 8px 8px 0;
    padding: .6rem 1rem;
    font-size: 13px;
    color: #B5600D;
    margin-top: 1rem;
  }
</style>
</head>
<body>

<label>Enter elements separated by commas</label>
<div class="row">
  <input id="inp" type="text" value="1, 2, 3"
    placeholder="e.g. 1, 2, 3 or a, b, c" />
  <button onclick="compute()">Compute ▶</button>
</div>
<div class="err" id="err"></div>

<div class="stats" id="stats">
  <div class="stat">
    <div class="stat-label">Your set A</div>
    <div class="stat-value mono" id="s-set"></div>
  </div>
  <div class="stat">
    <div class="stat-label">n(A) — elements</div>
    <div class="stat-value" id="s-n"></div>
  </div>
  <div class="stat">
    <div class="stat-label">n(P(A)) = 2ⁿ</div>
    <div class="stat-value" id="s-pa"></div>
  </div>
</div>

<div class="formula" id="formula"></div>

<div class="subset-label" id="sub-label">All subsets in P(A)</div>
<div class="grid" id="grid"></div>
<div class="warn" id="warn"></div>

<script>
const sup = n => String(n).split('').map(d =>
  '⁰¹²³⁴⁵⁶⁷⁸⁹'[+d]).join('');

function powerSet(arr) {
  const res = [[]];
  for (const el of arr) {
    const len = res.length;
    for (let i = 0; i < len; i++) res.push([...res[i], el]);
  }
  return res;
}

function compute() {
  const raw = document.getElementById('inp').value;
  const err = document.getElementById('err');
  const stats = document.getElementById('stats');
  const formula = document.getElementById('formula');
  const grid = document.getElementById('grid');
  const warn = document.getElementById('warn');
  const subLabel = document.getElementById('sub-label');

  err.textContent = '';
  warn.style.display = 'none';

  const parts = raw.split(',').map(s => s.trim()).filter(Boolean);
  if (!parts.length) {
    err.textContent = 'Please enter at least one element.';
    stats.style.display = 'none';
    formula.style.display = 'none';
    subLabel.style.display = 'none';
    return;
  }
  if (parts.length > 10) {
    err.textContent = 'Maximum 10 elements (2¹⁰ = 1024 subsets).';
    return;
  }

  const seen = new Map();
  parts.forEach(p => seen.set(p.toLowerCase(), p));
  const unique = [...seen.values()];
  const dupes = parts.length - unique.length;
  const n = unique.length;
  const subsets = powerSet(unique);
  const total = subsets.length;

  document.getElementById('s-set').textContent = '{' + unique.join(', ') + '}';
  document.getElementById('s-n').textContent = n;
  document.getElementById('s-pa').textContent = total;
  stats.style.display = 'grid';

  formula.style.display = 'block';
  formula.textContent =
    `n(P(A)) = 2ⁿ = 2${sup(n)} = ${total}` +
    `   ·   if n(A) = ${n} then n(P(A)) = ${total}`;

  subLabel.style.display = 'block';
  grid.innerHTML = '';
  subsets.forEach((sub, i) => {
    const label = sub.length === 0 ? '∅ (empty set)' : '{' + sub.join(', ') + '}';
    const div = document.createElement('div');
    div.className = 'subset-item' + (i === 0 || i === subsets.length - 1 ? ' special' : '');
    div.innerHTML = `<span class="index">${i}.</span><span>${label}</span>`;
    grid.appendChild(div);
  });

  if (dupes > 0) {
    warn.style.display = 'block';
    warn.textContent = `${dupes} duplicate${dupes > 1 ? 's' : ''} removed — sets only keep unique elements.`;
  }
}

document.getElementById('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter') compute();
});

compute();
</script>
</body>
</html>
